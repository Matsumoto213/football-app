AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Football App Backend

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
  Api:
    Cors:
      AllowMethods: "'GET,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"

Parameters:
  ApiFootballKey:
    Type: String
    NoEcho: true
    Description: API-FOOTBALL API Key

Resources:
  SearchTeamsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        EntryPoints:
          - src/handlers/searchTeams.ts
    Properties:
      CodeUri: ./
      Handler: searchTeams.handler
      Environment:
        Variables:
          API_FOOTBALL_KEY: !Ref ApiFootballKey
      Events:
        SearchTeams:
          Type: Api
          Properties:
            Path: /teams/search
            Method: GET

  GetTeamFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        EntryPoints:
          - src/handlers/getTeam.ts
    Properties:
      CodeUri: ./
      Handler: getTeam.handler
      Environment:
        Variables:
          API_FOOTBALL_KEY: !Ref ApiFootballKey
      Events:
        GetTeam:
          Type: Api
          Properties:
            Path: /teams/{teamId}
            Method: GET

  GetFixturesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        EntryPoints:
          - src/handlers/getFixtures.ts
    Properties:
      CodeUri: ./
      Handler: getFixtures.handler
      Environment:
        Variables:
          API_FOOTBALL_KEY: !Ref ApiFootballKey
      Events:
        GetFixtures:
          Type: Api
          Properties:
            Path: /teams/{teamId}/fixtures
            Method: GET

  GetTeamPlayersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        EntryPoints:
          - src/handlers/getTeamPlayers.ts
    Properties:
      CodeUri: ./
      Handler: getTeamPlayers.handler
      Environment:
        Variables:
          API_FOOTBALL_KEY: !Ref ApiFootballKey
      Events:
        GetTeamPlayers:
          Type: Api
          Properties:
            Path: /teams/{teamId}/players
            Method: GET

  GetFixtureDetailFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        EntryPoints:
          - src/handlers/getFixtureDetail.ts
    Properties:
      CodeUri: ./
      Handler: getFixtureDetail.handler
      Environment:
        Variables:
          API_FOOTBALL_KEY: !Ref ApiFootballKey
      Events:
        GetFixtureDetail:
          Type: Api
          Properties:
            Path: /fixtures/{fixtureId}
            Method: GET

  GetFixtureStatsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        EntryPoints:
          - src/handlers/getFixtureStats.ts
    Properties:
      CodeUri: ./
      Handler: getFixtureStats.handler
      Environment:
        Variables:
          API_FOOTBALL_KEY: !Ref ApiFootballKey
      Events:
        GetFixtureStats:
          Type: Api
          Properties:
            Path: /fixtures/{fixtureId}/stats
            Method: GET

  GetFixtureFormationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        EntryPoints:
          - src/handlers/getFixtureFormation.ts
    Properties:
      CodeUri: ./
      Handler: getFixtureFormation.handler
      Environment:
        Variables:
          API_FOOTBALL_KEY: !Ref ApiFootballKey
      Events:
        GetFixtureFormation:
          Type: Api
          Properties:
            Path: /fixtures/{fixtureId}/formation
            Method: GET

  GetFixtureLineupsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        EntryPoints:
          - src/handlers/getFixtureLineups.ts
    Properties:
      CodeUri: ./
      Handler: getFixtureLineups.handler
      Environment:
        Variables:
          API_FOOTBALL_KEY: !Ref ApiFootballKey
      Events:
        GetFixtureLineups:
          Type: Api
          Properties:
            Path: /fixtures/{fixtureId}/lineups
            Method: GET

  GetPlayerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        EntryPoints:
          - src/handlers/getPlayer.ts
    Properties:
      CodeUri: ./
      Handler: getPlayer.handler
      Environment:
        Variables:
          API_FOOTBALL_KEY: !Ref ApiFootballKey
      Events:
        GetPlayer:
          Type: Api
          Properties:
            Path: /players/{playerId}
            Method: GET

  GetLeagueTeamsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        EntryPoints:
          - src/handlers/getLeagueTeams.ts
    Properties:
      CodeUri: ./
      Handler: getLeagueTeams.handler
      Environment:
        Variables:
          API_FOOTBALL_KEY: !Ref ApiFootballKey
      Events:
        GetLeagueTeams:
          Type: Api
          Properties:
            Path: /leagues/{leagueId}/teams
            Method: GET

  GetPlayerStatsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        EntryPoints:
          - src/handlers/getPlayerStats.ts
    Properties:
      CodeUri: ./
      Handler: getPlayerStats.handler
      Environment:
        Variables:
          API_FOOTBALL_KEY: !Ref ApiFootballKey
      Events:
        GetPlayerStats:
          Type: Api
          Properties:
            Path: /players/{playerId}/stats
            Method: GET

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
